name: AI Research Radar

on:
  schedule:
    # 07:00 Asia/Kolkata (UTC+5:30) every day
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-research-radar
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ai-research-radar/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ai-research-radar/requirements.txt

      - name: Discover research topics and publish Google Doc
        env:
          SERPAPI_API_KEY: \${{ secrets.SERPAPI_API_KEY }}
          GOOGLE_OAUTH_CLIENT_JSON: \${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: python ai-research-radar/src/agent.py

      - name: Commit reports and deduplication state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-research-radar/reports/
          git diff --cached --quiet || {
            git commit -m "chore: publish daily AI research radar report"
            git push
          }

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-research-radar-\${{ github.run_id }}
          path: ai-research-radar/reports/latest.*
          retention-days: 30
          if-no-files-found: error
